name: ScoreKings CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Lint Application Code
  # -------------------------------------------------------------
  build-and-test:
    name: Node.js Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Typecheck
        run: npm run build --if-present

      - name: Execute Tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          SCOREKINGS_API_KEY: ${{ secrets.SCOREKINGS_API_KEY || 'ci-test-key' }}

  # -------------------------------------------------------------
  # Job 2: Validate Terraform Infrastructure
  # -------------------------------------------------------------
  terraform-validate:
    name: Terraform Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # -------------------------------------------------------------
  # Job 3: Verify Docker Container Build
  # -------------------------------------------------------------
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scorekings-integration-kit:latest