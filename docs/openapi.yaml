openapi: 3.0.3
info:
  title: ScoreKings Partner Integration API
  version: 1.0.0
  description: Partner API for legacy data migration and licensed league feeds.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/v1/health:
    get:
      summary: Get system and API health
      tags: [System]
      responses:
        "200":
          description: Service is available.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, apiVersion, timestamp]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: scorekings-integration-kit }
                  apiVersion: { type: string, example: v1 }
                  timestamp: { type: string, format: date-time }
  /api/v1/migration/ingest:
    post:
      summary: Ingest and transform legacy sports or league data
      tags: [Migration]
      security:
        - ScoreKingsApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    records:
                      type: array
                      items: { type: object }
                - type: array
                  items: { type: object }
          text/csv:
            schema:
              type: string
              example: |
                legacy_id,league_name,season
                L-01,Premier League,2025
      responses:
        "200":
          description: All records transformed and stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationResult" }
        "207":
          description: Some records could not be transformed.
        "401":
          description: Missing or invalid partner API key.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: No records could be transformed.
  /api/v1/licensing/leagues:
    get:
      summary: Get paginated licensed league data
      tags: [Licensing]
      security:
        - ScoreKingsApiKey: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: season
          schema: { type: string }
        - in: query
          name: entityType
          schema:
            type: string
            enum: [league, team, athlete, game, unknown]
      responses:
        "200":
          description: Partner's licensed data and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LeagueRecord" }
                  pagination:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "401":
          description: Missing or invalid partner API key.
components:
  securitySchemes:
    ScoreKingsApiKey:
      type: apiKey
      in: header
      name: X-ScoreKings-API-Key
  schemas:
    MigrationResult:
      type: object
      required: [migrationId, status, receivedCount, transformedCount, durationMs, errors]
      properties:
        migrationId: { type: string }
        status: { type: string, enum: [SUCCESS, PARTIAL_SUCCESS, FAILED] }
        receivedCount: { type: integer }
        transformedCount: { type: integer }
        durationMs: { type: integer }
        errors: { type: array, items: { type: string } }
    LeagueRecord:
      type: object
      properties:
        entityType: { type: string }
        externalId: { type: string }
        name: { type: string }
        leagueName: { type: string }
        season: { type: string }
        attributes: { type: object }
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, timestamp]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        timestamp: { type: string, format: date-time }
